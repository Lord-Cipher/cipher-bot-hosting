services:
  - type: web
    name: cipher-bot-hosting
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FORCE_POLLING
        value: "true"
      - key: WEBHOOK_ENABLED
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
